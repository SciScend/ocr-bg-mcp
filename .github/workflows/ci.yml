name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The tests run real Tesseract on rendered Bulgarian text: the system
      # models (tesseract-ocr-bul), poppler for PDFs, DejaVu for the test font.
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tesseract-ocr tesseract-ocr-bul poppler-utils fonts-dejavu-core

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run pytest -q
